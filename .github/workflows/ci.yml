name: AegisOps CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality-and-test:
    name: Lint, Type Check, Test & Continuous Evaluation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisops_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip and install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: |
          python -m ruff check .

      - name: Run Ruff Format Check
        run: |
          python -m ruff format --check .

      - name: Run Mypy Static Type Analysis
        run: |
          mypy backend/app

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aegisops_test
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Run Pytest Suite with Coverage
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aegisops_test
          SECRET_KEY: ci-environment-test-secret-key-32-chars-long
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml

      - name: Run Continuous Evaluation Smoke Test
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aegisops_test
        run: |
          python scripts/evaluate_continuous.py

      - name: Run End-to-End Scenario Runner Verification
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aegisops_test
        run: |
          python scripts/run_scenario.py --scenario high_latency --mode live-sim

      - name: Run Phase 7 Release Benchmark Gate
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aegisops_test
        run: |
          python scripts/run_release_benchmark.py --mode fixture

  container-build:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: quality-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aegisops:ci-test
